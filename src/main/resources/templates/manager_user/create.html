<section th:replace="shared/header" xmlns:th="http://www.thymeleaf.org"></section>

<section style="margin-top: 50px">
  <div class="row vh-100">
    <div class="col-lg-12">
      <p class="text-danger" style="text-align: center" th:text="${error}"></p>
      <p style="color: green;text-align: center" th:text="${success}"></p>
      <form action="/ManagerUser/Create" method="POST" id="form">
        <div class="container rounded bg-white mt-5 mb-5">
          <div class="row">
            <div class="col-md-12 border-right">
              <div class="p-3 py-8">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h4 class="text-right">CREATE TEACHER ACCOUNT</h4>
                </div>

                <div class="row mt-2">
                  <div class="col-md-12"><label class="labels" for="fullName">FullName</label><input type="text" class="form-control" placeholder="Full Name" name="fullName" id="fullName" required></div>
                </div>

                <div class="row mt-3">
                  <div class="col-md-12">
                    <label class="labels" for="email">Email</label>
                    <input type="email" class="form-control" placeholder="Email" name="email" id="email" required>
                  </div>


                  <div class="col-md-12">
                    <label class="labels" for="phone">Phone(Optional)</label>
                    <input type="text" class="form-control" placeholder="Phone" name="phone" id="phone">
                  </div>


                  <div class="col-md-12">
                    <label class="labels">Gender</label>
                    <select name="gender" class="form-control">
                      <option th:each="gender: ${genders}" th:value="${gender}"  th:text="${gender}"></option>
                    </select>
                  </div>

                  <div class="col-md-12">
                    <label class="labels" for="username">Username</label>
                    <input type="text" class="form-control" placeholder="Your username" name="username" id="username" required>
                  </div>
                </div>

                <div class="mt-5 text-center"><button class="btn btn-primary profile-button" type="submit">Submit</button></div>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>


<section th:replace="shared/footer" xmlns:th="http://www.thymeleaf.org"></section>

<script>
  const fullNameInput = document.getElementById("fullName");
  const emailInput = document.getElementById("email");
  const phoneInput = document.getElementById("phone");
  const usernameInput = document.getElementById("username");

  const patternEmail = /^[a-zA-Z][\w-]+@([\w]+\.[\w]+|[\w]+\.[\w]{2,}\.[\w]{2,})$/;
  const patternUsername = /^(?=.{6,30}$)(?!.*[_.]{2})[a-zA-Z0-9]+([_.]?[a-zA-Z0-9]+)*$/;

  document.getElementById("form").addEventListener("submit", function (event) {
    if (fullNameInput.value.trim().length === 0) {
      document.getElementById("error").innerHTML = "You have to input your name";
      event.preventDefault();
    } else if (phoneInput.value.length !== 0 && phoneInput.value.length !== 10) {
      document.getElementById("error").innerHTML = "Phone must be 10 numbers";
      event.preventDefault();
    } else if (!patternEmail.test(emailInput.value.trim()) || emailInput.value.trim().length < 6 || emailInput.value.trim().length > 50) {
      document.getElementById("error").innerHTML = "Email invalid";
      event.preventDefault();
    } else if (!patternUsername.test(usernameInput.value)) {
      document.getElementById("error").innerHTML = "The username contains only alphabet and numbers, (_) or (.), doesn't start with (_) or (.)" +
              ". \\nNo consecutive _ or . characters allowed" +
              ". \\nMinimum 6 characters and maximum 30 characters";
      event.preventDefault();
    }
  });

</script>
