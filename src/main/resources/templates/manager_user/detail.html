<section th:replace="shared/header" xmlns:th="http://www.thymeleaf.org"></section>

<section style="margin-top: 50px">
  <div class="row vh-100">
    <div class="col-lg-12">
      <div class="row">
        <div class="col-md-4">
          <button class="btn btn-outline-success" id="username" th:text="${user.username}"></button>
        </div>
        <div class="col-md-4">
          <img th:src="${user.image}" alt="" width="250" height="250" id="image"><br>
        </div>
      </div>

      <div class="col-md-12 border-right">
        <div class="row mt-2">
        </div>
        <div class="row mt-3">
          <div class="col-md-6"><label class="labels">FullName</label><input type="text" class="form-control" placeholder="Full Name" id="FullName" th:value="${user.fullName}" name="FullName" readonly required></div>

          <div class="col-md-6">
            <label class="labels">Email</label>
            <input type="email" class="form-control" placeholder="Email" id="email" name="email" th:value="${user.email}" readonly required>
          </div>
          <div class="col-md-6"><label class="labels">Phone</label><input type="text" class="form-control" th:value="${user.phone}" placeholder="Phone" id="phone" name="phone" readonly></div>
          <div class="col-md-6">
            <label class="labels">Gender</label>
            <select name="gender" class="form-control" id="gender" disabled>
              <option th:each="gender: ${genders}" th:value="${gender}" th:selected="${gender == user.gender}" th:text="${gender}"></option>
            </select>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<section th:replace="shared/footer" xmlns:th="http://www.thymeleaf.org"></section>
