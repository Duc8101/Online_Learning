<section th:replace="shared/header" xmlns:th="http://www.thymeleaf.org"></section>

<script src="https://kit.fontawesome.com/42147adfb1.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    #lessonContent {
        background-color: #EEEEEE;
        overflow-y: scroll;
        height: 820px
    }

    myVideo {
        width: 80%;
        height: 700px;
        margin-left: 10%;
    }
</style>

<div class="container-fluid">
    <div class="row" style="border-right: 1px solid black">
        <div id="lessonContent" class="col-md-3" style="background-color: #EEEEEE; border-right: 1px solid black">
            <h3 style="margin-top: 1%; margin-bottom: 1%"><a href="/Courses"
                                                             style="color: #06BBCC; text-decoration: none"> <i
                    class="bi bi-arrow-left"></i> Back</a></h3>
            <h3>COURSE CONTENT</h3>
            <div class="teacher row">
                <div class="col-md-4">

                </div>
            </div>
            <div th:each="lesson, iterStatus: ${lessons}" class="list-group" style="margin: 15px 0">
                <div class="list-group-item list-group-item-info" style="background-color: #06BBCC">
                    <div class="row">
                        <div class="col-md-10">
                            <!--Control card have same target and false is close -->
                            <a style="background-color: #06BBCC; color: white; text-decoration: none; cursor: pointer"
                               data-bs-toggle="collapse"
                               th:data-bs-target="${'#collapseExample'} + ${iterStatus.index + 1}" aria-expanded="false"
                               th:aria-controls="${'collapseExample'} + ${iterStatus.index + 1}">
                                <i class="bi bi-plus-circle-fill" style="margin-right: 3%"></i><span
                                    th:text="${(iterStatus.index + 1) + '. ' + lesson.lessonName}"></span>
                            </a>
                        </div>
                    </div>

                </div>

                <div th:class="${'list-group collapse multi-collapse '} + ${lesson.lessonId == lessonId ? 'show' : ''}"
                     th:id="${'collapseExample' } + ${iterStatus.index + 1}">
                    <div class="teacher">

                    </div>

                    <div th:each="video, iterStatus: ${lesson.videos}"
                         class="list-group-item list-group-item-action">
                        <div class="row">
                            <div class="col-md-10">
                                <a th:href="${'/ViewLesson/'} + ${courseId} + ${'?lessonId='} + ${video.lessonId} + ${'&name='} + ${video.videoName} + ${'&video='} + ${video.fileVideo}"
                                   style="text-decoration: none; color: black">
                                    <i class="bi bi-play-circle" style="color: red; margin-right: 2%"></i><span
                                        th:text="${video.videoName}"></span>
                                </a>
                            </div>
                            <div class="col-md-2 teacher">

                            </div>
                        </div>

                    </div>

                    <div th:each="pdf, iterStatus: ${lesson.pdfs}" class="list-group-item list-group-item-action">
                        <div class="row">
                            <div class="col-md-10">
                                <a th:href="${'/ViewLesson/'} + ${courseId} + ${'?lessonId='} + ${pdf.lessonId} + ${'&name='} + ${pdf.pdfName} + ${'&pdf='} + ${pdf.filePdf}"
                                   style="text-decoration: none; color: black">
                                    <i class="bi bi-book" style="color: green; margin-right: 2%"></i><span
                                        th:text="${pdf.pdfName}"></span>
                                </a>
                            </div>
                            <div class="col-md-2 teacher">

                            </div>
                        </div>

                    </div>

                </div>
            </div>

        </div>

        <div class="col-md-9" style="background-color: #f0fbfc">
            <h3 th:text="${'Learning: '} + ${name}"></h3>
            <video th:if="${video.length() > 0}" id="myVideo" controls autoplay>
                <source th:src="${'/Video/'} + ${video}" type="video/mp4">
            </video>

            <div th:if="${pdf.length() > 0}" class="mx-5">
                <embed id="myPDF" th:src="${'/PDF/'} + ${pdf}" width="98%" height="750" type="application/pdf"
                       alt="sorry">
            </div>
        </div>
    </div>
</div>

<section th:replace="shared/footer" xmlns:th="http://www.thymeleaf.org"></section>
